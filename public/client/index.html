<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosko</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #content {
      width: 100%; height: 100%;
      display: grid;
    }
    #content.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #content.layout-2h { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    #content.layout-2v { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    #content.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .cell {
      position: relative;
      overflow: hidden;
      background: #000;
    }
    .cell iframe, .cell img, .cell video {
      width: 100%; height: 100%;
      border: none;
      object-fit: contain;
      background: #000;
      display: block;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .cell iframe.loaded, .cell img.loaded, .cell video.loaded {
      opacity: 1;
      transform: scale(1);
    }
    .cell iframe {
      position: absolute;
      inset: 0;
    }
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(1.03); }
      to { opacity: 1; transform: scale(1); }
    }
    #status-overlay {
      position: fixed;
      top: 20px; right: 20px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.4);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      letter-spacing: 0.05em;
    }
    #status-overlay.show { opacity: 1; }
    #status-overlay.error { background: rgba(220, 38, 38, 0.8); color: white; }
    #status-overlay.warning { background: rgba(245, 158, 11, 0.8); color: white; }
    .blackout {
      background: #000 !important;
    }
    .identify-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: white;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .identify-overlay h1 {
      font-size: 12vw;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    .identify-overlay p {
      font-size: 2vw;
      opacity: 0.5;
      margin-top: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .error-screen {
      color: white;
      font-size: 1.2rem;
      text-align: center;
      padding: 2rem;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-direction: column;
    }
    .error-screen small {
      opacity: 0.5;
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .retry-indicator {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      margin-top: 12px;
      animation: pulse 1.5s infinite;
    }
    .cell-label {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(0,0,0,0.6);
      color: rgba(255,255,255,0.5);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      z-index: 10;
      pointer-events: none;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div id="status-overlay"></div>
  <div id="content" class="layout-1"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 2000 });
    const contentDiv = document.getElementById('content');
    const statusOverlay = document.getElementById('status-overlay');
    let youtubePlayers = [];
    let youtubeApiReady = false;
    let currentItems = [];
    let currentLayout = 'layout-1';
    let retryCounts = {};
    let watchdogInterval = null;
    let heartbeatInterval = null;
    const MAX_RETRIES = 3;
    
    function getClientId() {
      let id = localStorage.getItem('kiosko-client-id');
      if (!id) {
        id = 'kiosko-' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('kiosko-client-id', id);
      }
      return id;
    }

    function getClientName() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('name') || getClientId();
    }

    function showStatus(text, type) {
      statusOverlay.textContent = text;
      statusOverlay.className = 'show' + (type ? ' ' + type : '');
      setTimeout(() => statusOverlay.classList.remove('show', 'error', 'warning'), 3000);
    }

    function reportError(error, context) {
      console.error('[' + context + ']', error);
      socket.emit('client-error', {
        clientId: getClientId(),
        clientName: getClientName(),
        error: error.toString(),
        context: context,
        timestamp: new Date().toISOString()
      });
      showStatus('Error: ' + context, 'error');
    }

    socket.on('connect', () => {
      socket.emit('register', {
        clientId: getClientId(),
        name: getClientName()
      });
      showStatus(getClientName() + ' - Conectado');
      startHeartbeat();
    });

    socket.on('disconnect', () => {
      showStatus('Desconectado - Reconectando...', 'warning');
      stopHeartbeat();
    });

    socket.on('reconnect', () => {
      showStatus('Reconectado');
      startHeartbeat();
      if (currentItems.length > 0) {
        showContent(currentItems, currentLayout);
      }
    });

    function startHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(() => {
        socket.emit('heartbeat', {
          clientId: getClientId(),
          timestamp: new Date().toISOString()
        });
      }, 30000);
    }

    function stopHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }
    }

    function startWatchdog() {
      if (watchdogInterval) clearInterval(watchdogInterval);
      watchdogInterval = setInterval(() => {
        checkHealth();
      }, 10000);
    }

    function stopWatchdog() {
      if (watchdogInterval) {
        clearInterval(watchdogInterval);
        watchdogInterval = null;
      }
    }

    function checkHealth() {
      youtubePlayers.forEach((player, idx) => {
        try {
          if (!player || !player.getPlayerState) return;
          const state = player.getPlayerState();
          if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED) {
            console.log('Watchdog: reanudando player', idx);
            player.playVideo();
          }
          if (state === -1 || state === YT.PlayerState.CUED) {
            retryCounts[idx] = (retryCounts[idx] || 0) + 1;
            if (retryCounts[idx] <= MAX_RETRIES) {
              console.log('Watchdog: recargando player', idx, 'intento', retryCounts[idx]);
              player.playVideo();
            } else {
              reportError('YouTube player no responde despues de ' + MAX_RETRIES + ' intentos', 'youtube-watchdog');
            }
          } else {
            retryCounts[idx] = 0;
          }
        } catch (e) {
          reportError(e, 'youtube-health-check');
        }
      });
    }

    function clearContent() {
      contentDiv.innerHTML = '';
      contentDiv.className = 'layout-1';
      youtubePlayers.forEach(p => { try { p.destroy?.(); } catch(e) {} });
      youtubePlayers = [];
      retryCounts = {};
      stopWatchdog();
    }

    function isYouTubeUrl(url) {
      return /(?:youtube\.com|youtu\.be)/i.test(url);
    }

    function extractYouTubeId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
        /^([a-zA-Z0-9_-]{11})$/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    function loadYouTubeAPI() {
      return new Promise((resolve) => {
        if (window.YT && window.YT.Player) {
          youtubeApiReady = true;
          resolve();
          return;
        }
        window.onYouTubeIframeAPIReady = () => {
          youtubeApiReady = true;
          resolve();
        };
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
      });
    }

    function createAntiPausePlayer(containerId, videoId) {
      if (!youtubeApiReady) {
        reportError('YouTube API no lista', 'youtube-api');
        return;
      }
      try {
        const player = new YT.Player(containerId, {
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            mute: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            rel: 0,
            showinfo: 0,
            iv_load_policy: 3,
            playsinline: 1,
            loop: 1,
            playlist: videoId
          },
          events: {
            onReady: (event) => {
              event.target.playVideo();
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                event.target.playVideo();
              }
            },
            onError: (event) => {
              reportError('YouTube error code: ' + event.data, 'youtube-player');
            }
          }
        });
        youtubePlayers.push(player);
        return player;
      } catch (e) {
        reportError(e, 'youtube-create');
      }
    }

    function createCell(index, layout) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = index;
      if (layout !== 'layout-1') {
        const label = document.createElement('div');
        label.className = 'cell-label';
        label.textContent = 'Pantalla ' + (index + 1);
        cell.appendChild(label);
      }
      return cell;
    }

    function setLayout(layout) {
      contentDiv.className = layout;
    }

    function showContent(items, layout) {
      currentItems = items || [];
      currentLayout = layout || 'layout-1';
      
      // Fade out existing content
      const existingCells = contentDiv.querySelectorAll('.cell');
      if (existingCells.length > 0) {
        existingCells.forEach(cell => {
          cell.style.opacity = '0';
          cell.style.transform = 'scale(0.98)';
          cell.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        });
        
        setTimeout(() => {
          renderNewContent(items, layout);
        }, 400);
      } else {
        renderNewContent(items, layout);
      }
    }
    
    function renderNewContent(items, layout) {
      clearContent();
      setLayout(layout || 'layout-1');
      
      const count = layout === 'layout-4' ? 4 : layout === 'layout-2h' || layout === 'layout-2v' ? 2 : 1;
      
      for (let i = 0; i < count; i++) {
        const cell = createCell(i, layout);
        cell.style.opacity = '0';
        cell.style.transform = 'scale(1.02)';
        cell.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        contentDiv.appendChild(cell);
        
        const item = items[i];
        if (!item) {
          // Fade in empty cell
          requestAnimationFrame(() => {
            setTimeout(() => {
              cell.style.opacity = '1';
              cell.style.transform = 'scale(1)';
            }, i * 100);
          });
          continue;
        }
        
        const { url, type } = item;
        
        if (type === 'image') {
          const img = document.createElement('img');
          img.src = url;
          img.onload = () => {
            img.classList.add('loaded');
          };
          img.onerror = () => {
            cell.innerHTML = '<div class="error-screen">No se pudo cargar la imagen<br><small>' + url + '</small></div>';
            reportError('Error cargando imagen: ' + url, 'image-load');
          };
          cell.appendChild(img);
        } else if (type === 'video') {
          const video = document.createElement('video');
          video.src = url;
          video.autoplay = true;
          video.loop = true;
          video.muted = true;
          video.playsInline = true;
          video.onloadeddata = () => {
            video.classList.add('loaded');
          };
          let retryCount = 0;
          video.onerror = () => {
            retryCount++;
            if (retryCount <= MAX_RETRIES) {
              setTimeout(() => { video.load(); video.play(); }, 2000);
            } else {
              cell.innerHTML = '<div class="error-screen">No se pudo cargar el video<br><small>' + url + '</small><div class="retry-indicator">Reintentando...</div></div>';
              reportError('Error cargando video despues de ' + MAX_RETRIES + ' intentos: ' + url, 'video-load');
            }
          };
          video.onstalled = () => {
            console.log('Video stalled, recargando...');
            video.load();
            video.play();
          };
          video.onwaiting = () => {
            showStatus('Buffering...', 'warning');
          };
          cell.appendChild(video);
        } else if (type === 'youtube' || isYouTubeUrl(url)) {
          const videoId = extractYouTubeId(url);
          if (!videoId) {
            cell.innerHTML = '<div class="error-screen">No se pudo extraer el ID de YouTube<br><small>' + url + '</small></div>';
            reportError('ID invalido de YouTube: ' + url, 'youtube-parse');
            continue;
          }
          const containerId = 'yt-' + Date.now() + '-' + i;
          const div = document.createElement('div');
          div.id = containerId;
          div.style.cssText = 'width:100%;height:100%;position:absolute;inset:0;';
          cell.appendChild(div);
          
          loadYouTubeAPI().then(() => {
            createAntiPausePlayer(containerId, videoId);
            if (youtubePlayers.length > 0) startWatchdog();
            // Fade in the cell with YouTube
            requestAnimationFrame(() => {
              setTimeout(() => {
                cell.style.opacity = '1';
                cell.style.transform = 'scale(1)';
              }, 300);
            });
          }).catch(e => {
            reportError(e, 'youtube-api-load');
          });
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = url;
          iframe.style.cssText = 'width:100%;height:100%;position:absolute;inset:0;border:none;';
          iframe.onload = () => {
            iframe.classList.add('loaded');
          };
          iframe.onerror = () => {
            reportError('Error cargando iframe: ' + url, 'iframe-load');
          };
          cell.appendChild(iframe);
        }
        
        // Staggered fade in for each cell
        if (type !== 'youtube' && !isYouTubeUrl(url)) {
          requestAnimationFrame(() => {
            setTimeout(() => {
              cell.style.opacity = '1';
              cell.style.transform = 'scale(1)';
            }, i * 120);
          });
        }
      }
      
      socket.emit('content-changed', { items, layout });
      showStatus('Contenido actualizado');
    }

    socket.on('show', (data) => {
      if (Array.isArray(data.items)) {
        showContent(data.items, data.layout);
      } else {
        showContent([{ url: data.url, type: data.type }], 'layout-1');
      }
    });

    socket.on('command', (data) => {
      switch(data.command) {
        case 'reload':
          window.location.reload();
          break;
        case 'blackout':
          clearContent();
          contentDiv.className = 'layout-1 blackout';
          socket.emit('content-changed', { type: 'blackout' });
          showStatus('Blackout');
          break;
        case 'identify':
          showIdentify();
          break;
        case 'fullscreen':
          document.documentElement.requestFullscreen?.();
          break;
      }
    });

    function showIdentify() {
      clearContent();
      const div = document.createElement('div');
      div.className = 'identify-overlay';
      div.innerHTML = '<h1>' + getClientName() + '</h1><p>' + getClientId() + '</p>';
      contentDiv.appendChild(div);
      setTimeout(() => {
        if (document.querySelector('.identify-overlay')) {
          socket.emit('request-current-content');
        }
      }, 5000);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11' || (e.key === 'f' && e.ctrlKey)) {
        e.preventDefault();
        document.documentElement.requestFullscreen?.();
      }
      if (e.key === 'Escape') {
        e.preventDefault();
      }
      if (e.key === 'F5') {
        e.preventDefault();
      }
    });

    document.documentElement.requestFullscreen?.().catch(() => {});
  </script>
</body>
</html>
